# Weekly update PRs for the pinned workflow actions and the pinned base image (audit SC-008).
# There is no requirements file (Pillow is pinned in the Dockerfile), so pip is not listed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
