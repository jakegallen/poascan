name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile and import
        run: |
          python -m compileall -q poascan tools
          python -c "import poascan.server, poascan.agentapi"
      - name: Secret scan (tree and pushed commits)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python tools/keyscan.py
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then python tools/keyscan.py --range "$BEFORE..$GITHUB_SHA"; fi
      - name: Smoke test (empty DB, indexer off, no upstream calls)
        run: python tools/smoke_test.py
      - name: Unknown address is a 404 not-found state; real and archived Agents render; search rows carry balance and last activity
        run: python tools/notfound_test.py
      - name: Joining state (open, paused, derived pause)
        run: python tools/join_state_test.py
      - name: Every main route renders with maintenance on, joining paused and swap rows present
        run: python tools/routes_test.py
      - name: Header merge and Governance (Home plus Chain, Agents, Network, Governance; About in the footer; Chain and Network Token sub-tabs; 301s keep every query parameter; sitemap and llms.txt; Governance Overview, At risk, Graders, Charts, Rules)
        run: python tools/govnav_test.py
      - name: Grade history and open seats (settled seats only, scores only from settled juries, open seat counts read in the background at most 3 a minute and once per epoch, assignment lists never kept; header sort, CSV, API, MCP get_grade_history; UPGRADE prompt; join-pow in halts)
        run: python tools/gradehist_test.py
      - name: Grading list gated checks (no ETag upstream, so X-Poa-Blob-Age-S decides; body never read when unchanged; a rebuilt list downloaded at most every 20 min outside close windows; full read every 6 h; Stale follows the last check and minepoa's own as_of)
        run: python tools/grading_gate_test.py
      - name: Wallet binding (bulk /api/links every 10 min, copy kept on failure; vault, family size, chains with verified flags, link txs, joined_no_link warning in 72 h; address card; /wallet?address= lookup never echoes a non-address; API, MCP get_wallet_binding, OpenAPI, llms.txt, /about)
        run: python tools/wallet_binding_test.py
      - name: Grader patterns (Agreement, Peers, Spread, Top score, Distance and Mix from settled seats only; system graders out of percentiles and charts; n 20 minimum; Segment 1 Agreement and Peers only; timing network wide only; API, CSV, MCP) and settled only Calibration scores
        run: python tools/graderpat_test.py
      - name: Pending TTL from /api/params per segment (16 only as a flagged fallback, grading list cross check) and the expiry horizon per pending cohort (Watched E18 to E20; header sort, CSV, API, MCP get_pending_horizon; never a pending score)
        run: python tools/horizon_test.py
      - name: Intake per close (Set, Eligible, Cap, Admitted, Not admitted, Door and the draw Check from the engine fold; Eligible, not admitted per Agent with its draw place; Proposal L params; header sort, CSV, API, MCP get_intake; never a pending score)
        run: python tools/intake_test.py
      - name: Earn check (/help Start earning, /api/v1/earn, MCP get_earn_check; verdict, its record and checklist from public payloads; forum counts only, never text; no key, never submits)
        run: python tools/earn_test.py
      - name: Earn check in production mode (POAScan's archive and LabLeak mirror, no minepoa.com request; history, grading, ways, disclaimer)
        run: python tools/earn_local_test.py
      - name: Paused closes (overlapped_halt or maintenance windows on a close record tag it Paused on the epoch page, Chain and Governance close views, API paused and pause; absent fields change nothing; no request added)
        run: python tools/closepause_test.py
      - name: Health fix (minepoa's single-id 503 sheds are not feed failures; shed ids negative cached at least 60 s; a full chain tx ceiling holds that path; at most 30 tx requests a minute in all; a failed hourly read retried after its backoff)
        run: python tools/healthfix_test.py
      - name: Governance v2 (Settlement by origin epoch per close with sealed, paid and open; Changes per close from the engine fold; Never established; Panel and Age on the settle queue; header sort, CSV, API, MCP; never a pending score)
        run: python tools/govv2_test.py
      - name: Balance lag (fresher copy by checkpoint, not read time; an address read of 0 never beats a nonzero agent list row under 30 min old; a read past the explorer segment's final checkpoint is current; As of checkpoint N on the Balance stat)
        run: python tools/balance_lag_test.py
      - name: Join epoch (Never established joined segment from the join time and config boundaries, never the source; a missing epoch worked out from that segment's close records; S1 labels in By join epoch)
        run: python tools/joinepoch_test.py
      - name: Extras (Unverifiable tag on server-only signed releases; Sealed and Graded times per settle queue row from the last close record, timestamps only, never a pending score; header sort, API, Agent governance)
        run: python tools/extras1026_test.py
      - name: Sortable column headers (one shared component; arrows and aria-sort; numbers highest first, text A to Z; blanks last; server side with the URL; phone sort menu)
        run: python tools/headersort_test.py
      - name: POAScan's Score (weights from govscore.json sum to 1; deterministic 0 to 100; fold matches segment standing; monotonic; config driven; /about#score)
        run: python tools/govscore_test.py
      - name: Keys are never echoed, stored, logged or forwarded; security headers present
        run: python tools/keysafe_test.py
      - name: Visit counts are aggregate only, memory is bounded, /ops/visits is 404 without the token
        run: python tools/visits_test.py
      - name: Wallet setup code is made in the browser only; the server never calls poaswap.io
        run: python tools/registry_test.py
      - name: Event counts are allowlisted keys only; /ops/e takes fixed ids; search text never stored or logged
        run: python tools/events_test.py
      - name: Daily network aggregates come from the archive only (no upstream call), aggregate only; /ops/network is 404 without the token
        run: python tools/network_test.py
      - name: Outage regressions (grading index is cached; guard does not restart a CPU throttled VM)
        run: python tools/incident_test.py
      - name: Address and tx page cost (cached assignments and chains) and the per-client page rate limit
        run: python tools/pagecost_test.py
      - name: Audit fixes (input clamps, on-demand budgets and negative cache, swap finality and expiry, gzip and ETag, privacy copy)
        run: python tools/audit_test.py
      - name: Established set
        run: python tools/established_test.py
      - name: Graders tile (distinct sealers, official served, Halted state)
        run: python tools/graders_tile_test.py
      - name: Halts
        run: python tools/halts_test.py
      - name: Pulse
        run: python tools/pulse_test.py
      - name: Network upgrade recovery (live strip and /upgrade copy, per-route check, auto-clear)
        run: python tools/recovery_test.py
      - name: Fast index (cursor sync and backfill, tx fast path with minepoa fallback, seal counts, budget and 429 hold, wallet search, anchor timeline, status note, privacy)
        run: python tools/fastindex_test.py
      - name: Audit fixes (crawler page views read the archive only; nofollow on minepoa.com API links; per tab canonical and descriptions; epochs from and limit; per close rewards rows and CSV; llms.txt loop and read table, no credential in a URL; official links on /about)
        run: python tools/audit1028_test.py
      - name: Phase A (neutral disclosure; ranked sitemap, crawl delay; changelog link; health 503 doc; MCP get_epoch_rewards; sortable Health, Transactions, Census and Unlock tables)
        run: python tools/phasea_test.py
      - name: Grading halt rule (seal gap Stale and Down, keyless grade route read, Tx lookup Degraded under the fast index, 24 h route strip)
        run: python tools/sealgap_test.py
      - name: Swap API for POASwap (expired_at, cancelled_at, cancelled_after_expiry; status and include_expired filters)
        run: python tools/swapfields_test.py
      - name: Rendered page cache (per-path TTLs, single render per key, byte cap, background warmer for the heavy pages)
        run: python tools/htmlcache_test.py
      - name: Earning gates (source and read time per value, Inferred marks, birth panel versus seated graders)
        run: python tools/earngates_test.py
      - name: Door tracker (admit rate, TTL out, Proposal L params flag)
        run: python tools/door_test.py
      - name: Queue board (birth panel coverage, at 3 of 4, expiring, neutral closes; counts only)
        run: python tools/board_test.py
      - name: Records and firsts (24 h, 7 days, segment; archive and close records only)
        run: python tools/highlights_test.py
      - name: Intro templates test
        run: python tools/introwave_test.py
      - name: Genesis carry test
        run: python tools/carry_test.py
      - name: Polite polling (backoff with jitter and Retry-After, incremental feed, cadence, on-demand caps, upstream counter)
        run: python tools/polite_test.py
      - name: 401 backoff (a lone 401 keeps the 60 s feed; 3 in a row, 429, 5xx or a timeout slow it)
        run: python tools/backoff_401_test.py
      - name: Bench motion and ticker lead (newest tx first, rotation only while idle, reduced motion in place)
        run: python tools/bench_motion_test.py
      - name: Epoch card tips (a ? on every term, /about#epoch-card, lane totals and Seals capsules that add up)
        run: python tools/epoch_tips_test.py
      - name: Network upgrade milestones (verified times, live first-seen events kept across restarts, grouping, no upstream call)
        run: python tools/milestones_test.py
      - name: Wallet safety (pinned emblemai via npx, backup first, file names only, always --profile, no global install, POASwap wording)
        run: python tools/walletsafe_test.py
      - name: /start three steps, client wiring, frozen prompt template, /api/v1/prompts/join (blocks, ETag 304, 400s)
        run: python tools/start_test.py
      - name: Join prompt history and the /start box (hashes recomputed from git, every box line backed by the prompt, /api/v1/prompts/join/history)
        run: python tools/prompthist_test.py
      - name: swap cutover test
        run: python tools/swap_cutover_test.py
      - name: Swap status page /swap/<offer_id> (read only, castle offer from post 1332) and community status board link
        run: python tools/forum_promises_test.py
      - name: POASwap swap flag (read only, 60 s with If-None-Match, 15 min keep, unknown after, boot fallback SWAPS_LIVE)
        run: python tools/swapflag_test.py
      - name: Home headline row and Agents / hr (window and pause rule, own snapshots only, cached, /about#home, additive API fields)
        run: python tools/joins_test.py
      - name: Mobile render (main visible from the first paint, no blend layer on mobile, tight section spacing)
        run: python tools/mobile_render_test.py
      - name: Private ops stats (/ops/internal is 404 without the token, no-store, 31-day range, no IP, UA or tx id, no upstream call)
        run: python tools/opsinternal_test.py
      - name: Signup check-ins and the private funnel (strict allowlist, 400 on keys, no IP or UA, logged without the path, /ops/funnel is 404 without the token, no upstream call)
        run: python tools/checkin_test.py
      - name: Chart pop-out (?chart= and ?range= allowlist in app.js, strict /fragment/chart params, ranges only where the data reaches, milestone grouping, no upstream call, no entrance fade)
        run: python tools/chartpop_test.py
      - name: Private dashboard feed (/ops/dashboard is 404 without the token, no-store, 31-day range, 400 on other params, aggregate only, cached 60 s, no upstream call)
        run: python tools/opsdash_test.py
      - name: Feedback sweep (tx and receipt JSON 404s with found false, archive fallback, open epoch from tagged answers, payout status from the notice, receipt basis_state, established history)
        run: python tools/feedback_test.py
      - name: Genesis cut segments (1.26.89 database migrates to segment 1, new E0 and E1 never collide with segment 1 closes, height 2 anchors kept per segment, nonce restart is not a gap, ?segment pages and API)
        run: python tools/segments_test.py
      - name: Segment config (a third segment or a moved boundary by config only, current segment from /api/networks, boundary refunds, balance-shown fill, carried supply baseline, carried_over tags, balance as of checkpoint, Unconfirmed rewards, pop-out breaks)
        run: python tools/segconfig_test.py
      - name: Network overview (compact cards, live segment values, Signers, Version fallback, freshness from any live read)
        run: python tools/netoverview_test.py
      - name: Upgrade complete (official notice ends the upgrade, older notices superseded, no Halted tag, /upgrade dates, route check stops, milestones)
        run: python tools/upgrade_complete_test.py
      - name: Swap take wording (take again once on receipt_ready, status before any re-take, never loop; no re-call until filled)
        run: python tools/swap_retake_test.py
      - name: Join dialog retired (no dialog or trigger on pages, /fragment/join and /#join land on /start) and coming_soon state wording
        run: python tools/lazyjoin_test.py
      - name: Grading truth (the completion notice alone is not open; grade seals confirm it; an observed or official halt reads halted; no new request)
        run: python tools/grading_truth_test.py
      - name: Standing expiry estimate (observed rule, close L + estab_ttl + 1 from the last challenge_eligible epoch; null when unknown; labelled an estimate)
        run: python tools/standing_test.py
      - name: Signed notices (G0 signature on real saved records passes, altered fails, unsigned is Unverified; each tx read once, checked once; /api/v1/notices/verified, badge, /about line)
        run: python tools/signed_test.py
      - name: Onboarding blueprint safety cues (leak watch and critical-notice stop on write prompts, held is not paid, the 524 rule, no fee row; join prompt unchanged)
        run: python tools/blueprint_copy_test.py
      - name: GUID-shaped keys (redacted only in credential slots, bare GUID path or query refused and never logged, keyscan rules)
        run: python tools/guidkey_test.py
      - name: Standing view and at-risk list (at risk within 2 closes, pending answers with panel and grades, marks, /standing and /agents/at-risk API, MCP get_standing and list_at_risk, Standing Watch credit, swap status links, L + 7 and marks on the real E0 to E11 records)
        run: python tools/standing_view_test.py
      - name: Development banner (first in body above the sticky header, normal flow, exact text and X link, not dismissible, steel Upgrading strip, join prompt unchanged)
        run: python tools/devbar_test.py
      - name: Swap page state and signed backfill (a terminal API status wins over Fill landing on /swap/<offer_id>, every offer's page matches the API, canonical poaswap.io/status links, same-name signed txs kept and labelled, pending retries at 2 per run with backoff)
        run: python tools/swap_state_test.py
      - name: Swap settlement fields (taker_credit on final fills as poa minus fee_poa, refund_txid on cancels, receipt_state signed from the fill's receipt; null otherwise; archive only, no upstream read; API, CSV, MCP, OpenAPI, llms.txt, /about)
        run: python tools/swap_fields_test.py
      - name: Unfinished fill (money_moved null, not false, when a swap-fill was submitted but is not final; true when filled, false only with no fill tx; API, list, CSV, MCP; /swap page 'Fill submitted, not final' and payment unknown, status still Expired; Ask prompt and docs)
        run: python tools/unfinished_fill_test.py
      - name: Combined prompt hash slot (combined_sha256 null and nothing new rendered while poascan/combined_prompt.txt is absent; once present, one hash on /start, /about, llms.txt, the prompt APIs, MCP and OpenAPI; join prompt unchanged)
        run: python tools/combined_hash_test.py
      - name: Address balance freshness (a cached minepoa copy older than 30 min is dropped; the newer of it and the agent list wins, with balance_as_of and balance_source; read limits unchanged) and hosted join name search (MCP search, /api/v1/search, /search redirect; archive only)
        run: python tools/addr_cache_search_test.py
      - name: Opt-in kin groups (active only when every member's latest claim on the pinned claim post lists the same sorted members; leave, mismatch and one-sided read inactive; cap 50; malformed ignored; never inferred; API, MCP, OpenAPI, llms.txt, Kin row, /about#kin; no upstream read)
        run: python tools/kin_groups_test.py
      - name: Strain notice guard (a notice in place of data is never stored or cached; last real values kept and labelled stale; sanitized notice strip; meta.upstream_notice and balance_stale in API, MCP, OpenAPI, llms.txt; synthetic fixtures; no upstream read)
        run: python tools/strain_notice_test.py
      - name: Upgrading strip and lookup-paused note folded into the header status note (never render; reasons in the note)
        run: python tools/fold_notices_test.py
      - name: Request cost under load (grading state memo per db write, API micro cache with gzip reuse, no health or search caching, plainjson fast path)
        run: python tools/perf_test.py
      - name: Accuracy and resilience (grader counts from grade rows, Max reward from the rewards row, failed jobs retry soon, node counter restart explained, guard steal threshold)
        run: python tools/accuracy_test.py
      - name: Re-admission flag (back in established_after one close after removal, no eligibility record; history, standing state, address card)
        run: python tools/readmit_test.py
      - name: HTML page cache (weak ETag ignores what app.js recomputes, 304 on a match, 15 s browser and 30 s plus 15 s shared reuse, Vary once; /ops stays no-store)
        run: python tools/page_cache_test.py
      - name: Holder count labels (Holders (node) on tiles and charts, balances and node on the Health row, method on /about#holders)
        run: python tools/holders_label_test.py
      - name: Census clock (last and next run in the visitor's zone, Due, Stale past 26 h, in /api/health and MCP)
        run: python tools/census_clock_test.py
      - name: Paused lookups and dropped answers (503 endpoint halted on tx, notices and chains, Dropped at close, since fill)
        run: python tools/halt_test.py
      - name: Design tokens lint (no hex, rgb or px radius outside the style.css token block; views and app.js use token colors; three self-hosted faces; no em or en dashes)
        run: python tools/design_tokens_test.py
      - name: Phase 1 follow-ups (stat state tags instead of sub-lines, Network Charts 30d, visitor-local times)
        run: python tools/followups_test.py
      - name: Phase 2 liveliness (the Bench, score strip, Pour, live hooks)
        run: python tools/phase2_test.py
      - name: Phase 3 signature moments (maker's marks, hallmarks, the Pour)
        run: python tools/phase3_test.py
      - name: Activity map in the visitor's zone, Seals that never overlap (1.26.135)
        run: python tools/localmap_seals_test.py
      - name: Supply basis at the genesis cut (cum_supply, circulating plus locked, holders total and unlocks equal the supply; reconcile Mined explained)
        run: python tools/supply_test.py
      - name: Grading list (10 min reads, 5 near a close, backoff to 30 min with Retry-After, never per page view, raw copies only around a close, seal changes, Unconfirmed tag with established_source, Health row, /about notes)
        run: python tools/grading_test.py
      - name: Settle queue and exact grading counts (Queue tab, Overview stats, exact Graders, per Agent pending answers, seals and jury reasons, /api/governance/queue JSON and CSV, receipts and standing)
        run: python tools/grading_queue_test.py
      - name: Score v2 inputs from the grading list (qualifying seals and rate, Unconfirmed caps the level) and grading reconciliation rows
        run: python tools/grading_score_test.py
      - name: Established per minepoa's engine (genesis import plus established_after minus established_removed; no trusted, system or seat additions; L -1 drops at E6; At risk, API, Score)
        run: python tools/established_engine_test.py
      - name: Parsed blob caches see every write (two close-record copies in one second; the established_engine_test flake)
        run: python tools/blob_gen_test.py
      - name: Protocol timeline (seeded release and baseline hashes, hourly conditional GET of both client files, HEAD plus a 6 h full GET without a validator, source_change matched to signed releases, Stale after 3 h, /api/protocol JSON and CSV, allowlist)
        run: python tools/protocol_test.py
      - name: Active Agents chart (rolling 6 h distinct answerers per segment from the tx archive, no break at a cut, mining milestones, the pop-out ? definition, Home opener)
        run: python tools/active_series_test.py
      - name: No chart gaps (every line runs across a genesis cut or missing data as straight segments between real points; the cut is a milestone, sparklines included; no breaks sent)
        run: python tools/nogap_test.py
      - name: Swap write check (keyless, unsigned, empty swap-offer probe; open, paused and down; backoff; swaps status writes and health feed)
        run: python tools/swap_writes_test.py
      - name: Swap route resolver test (one source for swap order placement status)
        run: python tools/swap_route_test.py
      - name: Route halts test (hysteresis from existing probes; since and as-of; health, routes API, MCP, header status, Health, /upgrade never Upgrade complete while halted)
        run: python tools/routewatch_test.py
      - name: Apt from archive.ubuntu.com with retries and a 20 s timeout (the Azure mirror stalled 1.26.159's WebKit deps past the job timeout twice)
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99poascan > /dev/null
      - name: Install Playwright and Chromium (pinned, headless shell only) for the header render check
        run: |
          python -m pip install --disable-pip-version-check -q playwright==1.64.1
          python -m playwright install --with-deps --only-shell chromium
      - name: Header on one row at 360 and 390 px with every status pill, the longest included (compact status line under the wordmark, never hidden or clipped)
        env:
          CI: "true"
        run: python tools/header_row_test.py
      - name: Header status note (no strip under the header; tap at 390 px inside the viewport, hover, keyboard focus and Escape at 1280 px)
        env:
          CI: "true"
        run: python tools/statusdot_test.py
      - name: Tooltips and popovers on top (every note kind opened at 390 px by tap and 1280 px by click on Home, Governance tabs, Network, Token, Health, an address, /start, Census and an epoch; elementFromPoint at the centre and corners finds the note, its box inside the viewport)
        env:
          CI: "true"
        run: python tools/tip_layer_test.py
      - name: Install WebKit (pinned Playwright) for the mobile menu check
        run: python -m playwright install --with-deps webkit
      - name: Mobile menu at 360 and 390 px (opens under the header with visible, clickable links on a fresh load and after scrolling; Chromium and WebKit)
        env:
          CI: "true"
        run: python tools/mobile_menu_test.py
      - name: Chart pop-out never blank (visible Loading line, retry state after a failure or a CPT_MS timeout, Retry draws; Home hero cards and Network charts at 390 px in Chromium and WebKit and 1280 px; Stale tag on the Home headline numbers)
        env:
          CI: "true"
        run: python tools/chartpop_blank_test.py
      - name: Agent cells (one shared cell in every table and list; name to LabLeak or the short address, copy right after, ellipsis; no overlap at 360, 390 and 1280 px with 40+ character names)
        env:
          CI: "true"
        run: python tools/agent_cell_test.py
      - name: Milestone hover text in the visitor's zone (sparkline labels and ticks, chart chips, legend, SVG titles, aria labels; Los Angeles and Tokyo at 390 and 1280 px)
        env:
          CI: "true"
        run: python tools/marker_local_test.py

  deploy:
    needs: test
    if: github.repository == 'jakegallen/poascan' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a newer push waits instead of cancelling a deploy mid-flight.
    concurrency:
      group: fly-deploy-poascan
      cancel-in-progress: false
    environment:
      name: production
      url: https://poascan.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Deploy to Fly.io
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::FLY_API_TOKEN secret is missing or empty"; exit 1; fi
          flyctl deploy --remote-only --depot=false --config fly.toml -a poascan --build-arg GEOIP_MONTH="$(date -u +%Y-%m)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the new build is serving
        run: |
          # /healthz is process liveness; /api/health can be 503 when upstream minepoa.com is stale, so it is not checked here
          for i in 1 2 3 4 5 6; do
            curl -fsS https://poascan.io/healthz >/dev/null && curl -fsS https://poascan.io/ >/dev/null && curl -fsS https://poascan.io/openapi.json >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Ping IndexNow with the main pages
        continue-on-error: true
        run: python3 tools/indexnow.py
