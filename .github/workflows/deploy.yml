name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and import
        run: |
          python -m compileall -q poascan tools
          python -c "import poascan.server, poascan.agentapi"
      - name: Secret scan (tree and pushed commits)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python tools/keyscan.py
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then python tools/keyscan.py --range "$BEFORE..$GITHUB_SHA"; fi
      - name: Smoke test (empty DB, indexer off, no upstream calls)
        run: python tools/smoke_test.py
      - name: Joining state (open, delayed, paused)
        run: python tools/join_state_test.py
      - name: Every main route renders with maintenance on, joining delayed and swap rows present
        run: python tools/routes_test.py
      - name: Keys are never echoed, stored, logged or forwarded; security headers present
        run: python tools/keysafe_test.py

  deploy:
    needs: test
    if: github.repository == 'jakegallen/poascan' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a newer push waits instead of cancelling a deploy mid-flight.
    concurrency:
      group: fly-deploy-poascan
      cancel-in-progress: false
    environment:
      name: production
      url: https://poascan.io
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::FLY_API_TOKEN secret is missing or empty"; exit 1; fi
          flyctl deploy --remote-only --depot=false --config fly.toml -a poascan
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the new build is serving
        run: |
          # /healthz is process liveness; /api/health can be 503 when upstream minepoa.com is stale, so it is not checked here
          for i in 1 2 3 4 5 6; do
            curl -fsS https://poascan.io/healthz >/dev/null && curl -fsS https://poascan.io/ >/dev/null && curl -fsS https://poascan.io/openapi.json >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Ping IndexNow with the main pages
        continue-on-error: true
        run: python3 tools/indexnow.py
