        run: python tools/marker_local_test.py
      - name: Interactive API reference (/api/reference renders within the strict CSP, /api links it, static renderer served as JS) and robots steering AI crawlers to the API off /address/ /tx/
        run: python tools/apiref_test.py

  deploy:
    needs: test
    if: github.repository == 'jakegallen/poascan' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a newer push waits instead of cancelling a deploy mid-flight.
    concurrency:
      group: fly-deploy-poascan
      cancel-in-progress: false
    environment:
      name: production
      url: https://poascan.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Deploy to Fly.io
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::FLY_API_TOKEN secret is missing or empty"; exit 1; fi
          flyctl deploy --remote-only --depot=false --config fly.toml -a poascan --build-arg GEOIP_MONTH="$(date -u +%Y-%m)" --build-arg GIT_SHA="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the new build is serving
        run: |
          # /healthz is process liveness; /api/health can be 503 when upstream minepoa.com is stale, so it is not checked here.
          # The single dedicated-core box cold-starts slowly (heavy pages warm over a few minutes), so poll up to ~4 min with
          # a per-request timeout and only fail if process liveness never comes up. A slow first render of / is not a broken build.
          live=0
          for i in $(seq 1 24); do
            if curl -fsS --max-time 8 https://poascan.io/healthz >/dev/null 2>&1; then
              live=1
              curl -fsS --max-time 15 https://poascan.io/ >/dev/null 2>&1 && curl -fsS --max-time 15 https://poascan.io/openapi.json >/dev/null 2>&1 && exit 0
            fi
            sleep 10
          done
          if [ "$live" = 1 ]; then echo "process is live; heavy pages still warming after the window, accepting the deploy"; exit 0; fi
          echo "process liveness (/healthz) never came up in the window: broken build"; exit 1
      - name: Verify the deployed commit and the served prompt bytes (commit on /api/health and X-API-Commit equal this SHA; combined .text and join template sha256 equal the repo; served dash or key-in-URL is a warning)
        run: python3 tools/deploy_verify.py
      - name: Ping IndexNow with the main pages
        continue-on-error: true
        run: python3 tools/indexnow.py
