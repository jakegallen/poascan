# Fly.io config for https://poascan.io. Forks: set a unique app name below, then see README "Deploy your own on Fly.io".
# No secrets live here; deploy credentials come from FLY_API_TOKEN (a GitHub Actions secret or your shell).
app = "poascan"
primary_region = "sjc"
kill_signal = "SIGTERM"   # server.py flushes visit and upstream counts on SIGTERM (and SIGINT) before exiting
kill_timeout = 10

[build]

[env]
  PORT = "8080"
  POASCAN_DB = "/data/poascan.db"
  MALLOC_ARENA_MAX = "2"   # fewer glibc arenas: request threads stop fragmenting memory into per-thread pools

[[mounts]]
  source = "poascan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the indexer must keep running
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]   # WebSocket clients hold a connection each; the hub sends them no thread
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]   # shared-cpu-4x 1 GB (1.26.162): twice the 2x CPU baseline and burst balance after the 2026-10-26 steal; covered in part by a Fly shared reservation in sjc
  cpu_kind = "shared"
  cpus = 4
  memory = "1gb"
