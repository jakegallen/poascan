# Fly.io config for https://poascan.io. Forks: set a unique app name below, then see README "Deploy your own on Fly.io".
# No secrets live here; deploy credentials come from FLY_API_TOKEN (a GitHub Actions secret or your shell).
app = "poascan"
primary_region = "sjc"
kill_signal = "SIGTERM"   # server.py flushes visit and upstream counts on SIGTERM (and SIGINT) before exiting
kill_timeout = 10

[build]

[env]
  PORT = "8080"
  POASCAN_DB = "/data/poascan.db"
  MALLOC_ARENA_MAX = "2"   # fewer glibc arenas: request threads stop fragmenting memory into per-thread pools
  MALLOC_MMAP_THRESHOLD_ = "131072"   # 1.26.234: a fixed threshold; glibc raised it after each big free, so 128 KB to 32 MB blocks (page text, JSON reads) landed in the heap and fragmented it
  MALLOC_TRIM_THRESHOLD_ = "131072"   # 1.26.234: hand free heap tops back sooner (the guard also trims every 60 s)
  POASCAN_MAX_WORKERS = "6"   # 1.26.280: serving slots in all. The 16 (HEAVY_CAP 12) default was sized for the old multi-core box; on one dedicated core a dozen CPU-bound renders only slow each other (GIL + context thrash) and risk a watchdog restart loop. 6 total -> HEAVY_CAP 4, with the reserve below.
  POASCAN_SERVE_RESERVE = "2"   # 1.26.280: slots kept for cheap pages (homepage, /chain) so heavy renders and close ingest cannot take every slot. With MAX_WORKERS 6 this leaves HEAVY_CAP 4.

[[mounts]]
  source = "poascan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the indexer must keep running
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]   # WebSocket clients hold a connection each; the hub sends them no thread
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]   # performance-1x 2 GB (2026-11-07 PM): stepped down from performance-4x/8GB once the join surge passed and the 1.26.279 htmlcache WARM fix (#45) moved the heavy /network pages off the request path. performance-1x is the cheapest dedicated-CPU tier (no shared-CPU throttling, which was the cause of the Nov 7 503s + STALE tiles); one dedicated core plus the warm cache covers normal load. Step back up to performance-2x/4x if a sustained surge returns. Pinned here so deploys keep it (the 2026-11-02 lesson: an API-only hot-scale gets reset on redeploy).
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
