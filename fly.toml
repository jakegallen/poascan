# Fly.io config for https://poascan.io. Forks: set a unique app name below, then see README "Deploy your own on Fly.io".
# No secrets live here; deploy credentials come from FLY_API_TOKEN (a GitHub Actions secret or your shell).
app = "poascan"
primary_region = "sjc"
kill_signal = "SIGTERM"   # server.py flushes visit and upstream counts on SIGTERM (and SIGINT) before exiting
kill_timeout = 10

[build]

[env]
  PORT = "8080"
  POASCAN_DB = "/data/poascan.db"
  MALLOC_ARENA_MAX = "2"   # fewer glibc arenas: request threads stop fragmenting memory into per-thread pools
  MALLOC_MMAP_THRESHOLD_ = "131072"   # 1.26.234: a fixed threshold; glibc raised it after each big free, so 128 KB to 32 MB blocks (page text, JSON reads) landed in the heap and fragmented it
  MALLOC_TRIM_THRESHOLD_ = "131072"   # 1.26.234: hand free heap tops back sooner (the guard also trims every 60 s)

[[mounts]]
  source = "poascan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the indexer must keep running
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]   # WebSocket clients hold a connection each; the hub sends them no thread
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]   # performance-4x 8 GB (2026-11-07): the shared-cpu-4x/2GB tier was CPU-throttled under the live join surge + crawler load, so heavy page renders held every slot and the scheduled feed refreshes (analytics.py) could not get a slot -> homepage tiles went STALE and heavy pages (network/governance/chain) shed 503. Dedicated performance CPUs remove the throttling; 8 GB is the performance-4x floor and gives warm-cache headroom. Pinned here so deploys keep it (the 2026-11-02 lesson: an API-only hot-scale gets reset on redeploy).
  cpu_kind = "performance"
  cpus = 4
  memory = "8gb"
